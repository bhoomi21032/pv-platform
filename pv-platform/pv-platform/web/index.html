<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PV intake console</title>
<style>
:root{--bg:#eef3f4;--card:#fff;--ink:#14262b;--mute:#5b7078;--line:#d3dee1;--teal:#0f6b6b;--teal-ink:#fff;
--red:#b3261e;--red-bg:#fbe9e7;--amber:#8a5a00;--amber-bg:#fdf1d6;--green:#1f6b43;--green-bg:#e2f3e8;
--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#0f1a1d;--card:#16262a;--ink:#e6f0f2;--mute:#93aab1;--line:#2a3f45;--teal:#4cc2bd;--teal-ink:#06201f;
--red:#ff8f85;--red-bg:#3a1d1b;--amber:#f3c669;--amber-bg:#3a2e12;--green:#7fd7a3;--green-bg:#17301f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans)}
header{padding:20px 28px;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}
h1{font-size:20px;margin:0;font-weight:650;letter-spacing:-.01em}header p{margin:0;color:var(--mute)}
main{display:grid;grid-template-columns:minmax(320px,440px) 1fr;gap:20px;padding:20px 28px;max-width:1200px;margin:auto}
@media(max-width:860px){main{grid-template-columns:1fr;padding:14px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px}
h2{font-size:15px;margin:0 0 12px;font-weight:650}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 3px}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
textarea{min-height:92px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 12px}
button.primary{background:var(--teal);color:var(--teal-ink);border-color:var(--teal);font-weight:600}
button:disabled{opacity:.55;cursor:default}.samples{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.samples button{font-size:13px;padding:4px 10px}
.stepper{display:flex;margin:4px 0 16px}.step{flex:1;text-align:center;font-size:13px;color:var(--mute);position:relative;padding-top:20px}
.step::before{content:"";position:absolute;top:4px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--line)}
.step::after{content:"";position:absolute;top:9px;left:-50%;width:100%;height:2px;background:var(--line);z-index:0}
.step:first-child::after{display:none}.step.on{color:var(--ink)}.step.on::before,.step.on::after{background:var(--teal)}
.step.cur::before{box-shadow:0 0 0 4px color-mix(in srgb,var(--teal) 25%,transparent)}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-weight:650;font-size:13px}
.serious{background:var(--red-bg);color:var(--red)}.non{background:var(--green-bg);color:var(--green)}.warn{background:var(--amber-bg);color:var(--amber)}
.chip{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:1px 8px;margin:2px 4px 2px 0;font-size:13px}
.banner{background:var(--amber-bg);color:var(--amber);padding:10px 12px;border-radius:8px;margin:12px 0;font-size:14px}
.err{background:var(--red-bg);color:var(--red);padding:10px 12px;border-radius:8px;margin:12px 0;font-size:14px}
.mono{font-family:var(--mono);font-size:12.5px;color:var(--mute);word-break:break-all}
.tabs{display:flex;gap:6px;margin-bottom:14px}.tabs button[aria-selected=true]{background:var(--teal);color:var(--teal-ink);border-color:var(--teal)}
table{width:100%;border-collapse:collapse;font-size:13.5px}td,th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.empty{color:var(--mute);padding:24px 0;text-align:center}.fb{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.fb select{width:auto}
</style>
</head>
<body>
<header><h1>PV intake console</h1><p>Submit an adverse event report, watch it move through the queue, review the triage.</p></header>
<main>
<section class="card" aria-labelledby="f">
  <h2 id="f">New adverse event report</h2>
  <div class="samples"><button type="button" data-s="serious">Fill serious case</button><button type="button" data-s="mild">Fill mild case</button><button type="button" data-s="bad">Fill invalid case</button></div>
  <label for="reporter_type">Reporter</label>
  <select id="reporter_type"><option>physician</option><option>pharmacist</option><option>nurse</option><option>consumer</option><option>other</option></select>
  <div class="row"><div><label for="age">Patient age (years)</label><input id="age" type="number" value="54"></div>
  <div><label for="sex">Sex</label><select id="sex"><option value="F">Female</option><option value="M">Male</option><option value="U">Unknown</option></select></div></div>
  <label for="drug">Suspect drug</label><input id="drug" placeholder="e.g. Amoxicillin">
  <div class="row"><div><label for="dose">Dose (optional)</label><input id="dose" placeholder="500 mg twice daily"></div>
  <div><label for="onset">Onset date</label><input id="onset" type="date"></div></div>
  <label for="desc">What happened</label><textarea id="desc" placeholder="Describe the reaction"></textarea>
  <div class="row"><div><label for="outcome">Outcome</label><select id="outcome"><option>unknown</option><option>recovered</option><option>recovering</option><option>not_recovered</option><option>fatal</option></select></div>
  <div><label for="key">API key (rate-limit identity)</label><input id="key" value="web-console"></div></div>
  <p><button class="primary" id="go">Submit report</button></p>
</section>

<section>
  <div class="tabs" role="tablist"><button role="tab" aria-selected="true" data-t="job">Current report</button><button role="tab" aria-selected="false" data-t="q">Quarantine</button><button role="tab" aria-selected="false" data-t="s">Reviewer feedback</button></div>
  <div class="card" id="pane"></div>
</section>
</main>
<script>
const $=id=>document.getElementById(id), api=(p,o)=>fetch(p,o);
const SAMPLES={
 serious:{reporter_type:"physician",age:54,sex:"F",drug:"Amoxicillin",dose:"500 mg",desc:"Patient developed anaphylaxis within an hour of the second dose and was hospitalised overnight.",outcome:"recovered"},
 mild:{reporter_type:"consumer",age:31,sex:"M",drug:"Ibuprofen",dose:"200 mg",desc:"Mild headache and slight nausea for a few hours after taking the tablet.",outcome:"recovered"},
 bad:{reporter_type:"consumer",age:999,sex:"U",drug:"X",dose:"",desc:"rash",outcome:"unknown"}};
let tab="job", state={job:null,err:null,timer:null};
const today=()=>new Date().toISOString().slice(0,10); $("onset").value=today();
document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{const s=SAMPLES[b.dataset.s];
 $("reporter_type").value=s.reporter_type;$("age").value=s.age;$("sex").value=s.sex;$("drug").value=s.drug;$("dose").value=s.dose;$("desc").value=s.desc;$("outcome").value=s.outcome;$("onset").value=today()});
document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll("[data-t]").forEach(x=>x.setAttribute("aria-selected",x===b));render()});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

$("go").onclick=async()=>{
 clearInterval(state.timer);state.err=null;state.job=null;tab="job";
 document.querySelectorAll("[data-t]").forEach(x=>x.setAttribute("aria-selected",x.dataset.t==="job"));
 const body={reporter_type:$("reporter_type").value,patient_age_years:+$("age").value,patient_sex:$("sex").value,suspect_drug:$("drug").value,
  reaction_description:$("desc").value,onset_date:$("onset").value,outcome:$("outcome").value};
 if($("dose").value)body.dose=$("dose").value;
 $("go").disabled=true;
 try{
  const r=await api("/v1/reports",{method:"POST",headers:{"content-type":"application/json","x-api-key":$("key").value},body:JSON.stringify(body)});
  const j=await r.json();
  if(r.status===422)state.err={title:"Report quarantined. Fix these fields and resubmit.",items:j.errors.map(e=>`${e.field}: ${e.msg}`),qid:j.quarantine_id};
  else if(r.status===429)state.err={title:`Too many requests. Try again in ${r.headers.get("retry-after")} s.`,items:[]};
  else if(!r.ok)state.err={title:j.detail||"Request failed",items:[]};
  else{state.job={job_id:j.job_id,status:j.status,cached:j.cached};poll();state.timer=setInterval(poll,700)}
 }catch(e){state.err={title:"Cannot reach the API.",items:[String(e)]}}
 $("go").disabled=false;render();
};
async function poll(){
 if(!state.job)return;const r=await api("/v1/reports/"+state.job.job_id);if(!r.ok)return;
 state.job=await r.json();if(["done","failed"].includes(state.job.status))clearInterval(state.timer);render();
}
function badge(s){return s==="serious"?'<span class="badge serious">Serious</span>':'<span class="badge non">Non-serious</span>'}
function job(){
 if(state.err)return `<div class="err"><strong>${esc(state.err.title)}</strong><ul>${state.err.items.map(i=>`<li>${esc(i)}</li>`).join("")}</ul>${state.err.qid?`<span class="mono">quarantine id ${state.err.qid}</span>`:""}</div>`;
 const j=state.job; if(!j)return '<div class="empty">No report yet. Fill the form and submit.</div>';
 const order=["queued","processing","done"], i=Math.max(0,order.indexOf(j.status));
 const steps=["Submitted","Queued","Processing","Triaged"].map((t,k)=>`<div class="step ${k<=i+1?"on":""} ${k===i+1?"cur":""}">${t}</div>`).join("");
 let out=`<div class="stepper">${steps}</div><div class="mono">job ${j.job_id}${j.cached?" · served from cache":""}${j.duration_s!=null?" · "+j.duration_s+" s":""}</div>`;
 if(j.status==="failed")out+=`<div class="err">Triage failed after retries. A reviewer must handle this report manually.</div>`;
 if(j.result){const r=j.result;
  out+=`<h2 style="margin-top:14px">Triage result</h2><p>${badge(r.seriousness)} <span class="badge warn">${r.priority}</span> ${r.meddra_pt?`<span class="chip">${esc(r.meddra_pt)}</span>`:""}</p>`;
  if(r.source==="fallback"||r.needs_human_review)out+=`<div class="banner"><strong>Needs human review.</strong> ${r.source==="fallback"?"The model was unavailable, so a conservative rule-based triage was used.":"The triage flagged this report for review."}</div>`;
  out+=`<p>${r.criteria.map(c=>`<span class="chip">${esc(c.replace(/_/g," "))}</span>`).join("")||'<span class="mono">no seriousness criteria matched</span>'}</p><p>${esc(r.rationale)}</p>`;
  out+=`<div class="fb"><span>Is this triage right?</span><button data-v="agree">Yes, agree</button><button data-v="disagree">No, disagree</button>
   <select id="corr" aria-label="Corrected seriousness"><option value="">correct to…</option><option value="serious">serious</option><option value="non_serious">non_serious</option></select><span id="fbmsg" class="mono">${j.feedback?"feedback saved: "+j.feedback.verdict:""}</span></div>`;
 }
 return out;
}
async function sendFb(v){const c=$("corr").value;
 const r=await api("/v1/feedback",{method:"POST",headers:{"content-type":"application/json","x-api-key":$("key").value},body:JSON.stringify({job_id:state.job.job_id,verdict:v,...(c&&v==="disagree"?{corrected_seriousness:c}:{})})});
 $("fbmsg").textContent=r.ok?"feedback saved":"could not save feedback ("+r.status+")";}
async function quarantine(){const r=await api("/v1/quarantine?limit=25");const q=await r.json();
 if(!q.length)return '<div class="empty">Quarantine is empty. Invalid reports land here with the reason.</div>';
 return `<table><tr><th>When</th><th>Reason</th><th>Problems</th></tr>${q.map(x=>`<tr><td>${new Date(x.received_at*1000).toLocaleTimeString()}</td><td>${esc(x.reason)}</td><td>${x.errors.map(e=>esc(e.field+": "+e.msg)).join("<br>")}</td></tr>`).join("")}</table>`}
async function stats(){const s=await (await api("/v1/feedback/stats")).json();
 if(!s.total)return '<div class="empty">No feedback yet. Review a triage result and mark agree or disagree.</div>';
 return `<h2>Reviewer agreement</h2><p><span class="badge ${s.agreement_rate>=.9?"non":"warn"}">${Math.round(s.agreement_rate*100)}% agree</span></p><p>${s.agree} agree · ${s.disagree} disagree · ${s.total} total</p>`}
async function render(){const p=$("pane");
 p.innerHTML=tab==="job"?job():tab==="q"?await quarantine():await stats();
 p.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>sendFb(b.dataset.v));}
render();
</script>
</body>
</html>
